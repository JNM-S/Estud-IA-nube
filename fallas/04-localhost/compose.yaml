# FALLA 04 · «localhost no es la base de datos»
# Desde la raíz del repositorio:
#   docker compose -f fallas/04-localhost/compose.yaml --project-directory . up -d --build
#   curl -i http://localhost:8082/listo        -> 503 «base de datos no disponible»
#   docker compose -f fallas/04-localhost/compose.yaml --project-directory . logs api
#   docker compose -f fallas/04-localhost/compose.yaml --project-directory . down
# Pregunta: dentro del contenedor «api», ¿a qué máquina apunta localhost?
name: villa-nube-falla-localhost

services:
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: localhost        # ← el error
    ports:
      - "8082:8080"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
